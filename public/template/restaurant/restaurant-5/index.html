<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Brûlerie - Brunch & Coffee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        h1, .font-hand { font-family: 'Caveat', cursive; }
        body, h2, h3, .font-serif { font-family: 'Lora', serif; }
    </style>
</head>
<body class="bg-[#faf7f2] text-amber-950">

    <!-- Nav -->
    <nav class="max-w-5xl mx-auto px-6 py-8 flex justify-between items-center border-b border-amber-900/10">
        <div class="text-4xl font-hand text-amber-900">Café Brûlerie</div>
        <div class="hidden md:flex space-x-6 text-amber-800 font-bold">
            <a href="#brunch" class="hover:underline decoration-wavy decoration-amber-500">Le Brunch</a>
            <a href="#coffee" class="hover:underline decoration-wavy decoration-amber-500">Café de Spécialité</a>
        </div>
    </nav>

    <!-- Hero -->
    <section class="max-w-5xl mx-auto px-6 py-20 text-center">
        <div class="inline-block bg-amber-100 text-amber-800 px-4 py-1 rounded-full text-sm font-bold mb-8 transform -rotate-2">Ouvert 7/7 de 8h à 16h</div>
        <h1 class="text-7xl md:text-8xl mb-8 text-amber-900 leading-none">Prenez le temps<br>d'un bon café.</h1>
        <p class="text-xl text-amber-800/70 max-w-2xl mx-auto mb-12">Torréfaction artisanale, pâtisseries maison et avocado toasts préparés avec amour.</p>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <img src="https://loremflickr.com/400/500/coffee,latte?lock=7" class="w-full h-64 object-cover rounded-xl shadow-lg transform rotate-2">
            <img src="https://loremflickr.com/400/500/pancakes,brunch?lock=8" class="w-full h-64 object-cover rounded-xl shadow-lg transform -rotate-3 mt-8">
            <img src="https://loremflickr.com/400/500/avocado,toast?lock=9" class="w-full h-64 object-cover rounded-xl shadow-lg transform rotate-1 mt-4">
            <img src="https://loremflickr.com/400/500/bakery,croissant?lock=10" class="w-full h-64 object-cover rounded-xl shadow-lg transform -rotate-2 mt-12">
        </div>
    </section>

    <!-- Banner -->
    <section class="bg-amber-900 text-amber-50 py-16 text-center mt-20">
        <h2 class="text-3xl italic">"Le bonheur se trouve souvent au fond d'une tasse fumante."</h2>
    </section>

    <footer class="text-center py-12 text-amber-800/50 text-sm">
        <p>15 Rue des Torréfacteurs, 69000 Lyon</p>
    </footer>

</body>
</html>
