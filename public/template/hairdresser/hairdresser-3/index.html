<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Studio - Hair Pop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-violet-950 text-white selection:bg-pink-500 selection:text-white">

    <!-- Navbar -->
    <nav class="p-6 flex justify-between items-center absolute w-full z-50 mix-blend-difference">
        <div class="text-3xl font-black tracking-tighter">Color<span class="text-pink-500">Studio</span></div>
        <a href="#booking" class="bg-gradient-to-r from-pink-500 to-orange-500 text-white font-bold px-6 py-2 rounded-full hover:scale-105 transition transform">Book Now</a>
    </nav>

    <!-- Hero -->
    <section class="relative h-screen flex flex-col justify-center px-6 overflow-hidden">
        <div class="absolute inset-0 bg-violet-950/40 z-10"></div>
        <img src="https://loremflickr.com/1920/1080/pinkhair,salon?lock=42" alt="Coloration" class="absolute inset-0 w-full h-full object-cover z-0 filter saturate-150">
        
        <div class="relative z-20 max-w-5xl mx-auto w-full text-center">
            <h1 class="text-7xl md:text-9xl font-black uppercase tracking-tighter mb-6 leading-none">
                Make it<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-orange-500">Pop.</span>
            </h1>
            <p class="text-xl md:text-2xl font-bold mb-10 max-w-2xl mx-auto text-violet-200">
                Balayage signature, colorations pastel et transformations extrêmes. Révélez votre vraie couleur.
            </p>
            <a href="#gallery" class="inline-block bg-white text-violet-950 px-10 py-4 font-black rounded-full hover:bg-pink-500 hover:text-white transition">Voir la galerie</a>
        </div>
    </section>

    <!-- Gallery -->
    <section id="gallery" class="py-24 bg-violet-900">
        <div class="max-w-7xl mx-auto px-6">
            <h2 class="text-5xl font-black text-center mb-16 text-pink-400 uppercase tracking-tighter">Nos Réalisations</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <img src="https://loremflickr.com/400/500/blonde,balayage?lock=43" class="w-full h-80 object-cover rounded-3xl hover:scale-105 transition duration-500">
                <img src="https://loremflickr.com/400/500/purplehair?lock=44" class="w-full h-80 object-cover rounded-3xl hover:scale-105 transition duration-500 translate-y-8">
                <img src="https://loremflickr.com/400/500/curly,hair?lock=45" class="w-full h-80 object-cover rounded-3xl hover:scale-105 transition duration-500">
                <img src="https://loremflickr.com/400/500/orangehair?lock=46" class="w-full h-80 object-cover rounded-3xl hover:scale-105 transition duration-500 translate-y-8">
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer id="booking" class="bg-gradient-to-r from-pink-600 to-purple-600 py-20 text-center text-white">
        <h2 class="text-5xl font-black uppercase tracking-tighter mb-8">Ready to change ?</h2>
        <button class="bg-violet-950 text-white px-10 py-4 rounded-full font-bold text-xl hover:bg-white hover:text-violet-950 transition shadow-2xl">Prendre Rendez-vous en ligne</button>
    </footer>

</body>
</html>
