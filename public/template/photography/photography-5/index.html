<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOGUE - Fashion Editorial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-white text-black selection:bg-fuchsia-600 selection:text-white">

    <!-- Nav -->
    <nav class="p-8 flex justify-between items-center fixed w-full z-50 mix-blend-difference text-white">
        <div class="text-2xl font-black tracking-tighter uppercase">STUDIO<span class="text-fuchsia-600">.</span></div>
        <div class="text-sm font-bold uppercase tracking-widest hover:text-fuchsia-600 transition cursor-pointer">Menu</div>
    </nav>

    <!-- Hero -->
    <section class="min-h-screen flex items-center pt-20 px-6 md:px-20">
        <div class="w-full flex flex-col md:flex-row items-center gap-12">
            <div class="md:w-1/2 z-10">
                <h1 class="text-[5rem] md:text-[8rem] font-black uppercase leading-[0.8] tracking-tighter mb-8">
                    Fashion<br><span class="text-fuchsia-600">Editor</span><br>ial.
                </h1>
                <p class="text-xl font-light text-gray-500 max-w-sm mb-12">
                    Studio photo basé à Paris. Éditoriaux de mode, beauté et campagnes publicitaires.
                </p>
                <a href="#work" class="bg-black text-white px-10 py-4 font-bold uppercase tracking-widest hover:bg-fuchsia-600 transition inline-block">View Work</a>
            </div>
            <div class="md:w-1/2 relative w-full h-[70vh]">
                <div class="absolute inset-0 bg-fuchsia-100 transform translate-x-8 translate-y-8 -z-10"></div>
                <img src="https://loremflickr.com/800/1000/fashion,model?lock=100" class="w-full h-full object-cover">
            </div>
        </div>
    </section>

    <!-- Grid -->
    <section id="work" class="py-32 bg-zinc-50">
        <div class="max-w-[1400px] mx-auto px-6 grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-8">
            <img src="https://loremflickr.com/600/800/makeup,model?lock=101" class="w-full h-full object-cover col-span-2 md:col-span-1">
            <img src="https://loremflickr.com/600/600/fashion,red?lock=102" class="w-full h-full object-cover">
            <img src="https://loremflickr.com/600/600/fashion,blue?lock=103" class="w-full h-full object-cover mt-12">
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-fuchsia-600 text-white py-32 text-center">
        <h2 class="text-6xl md:text-8xl font-black uppercase tracking-tighter mb-8 hover:scale-105 transition transform cursor-pointer">Let's shoot.</h2>
        <p class="font-bold tracking-widest uppercase">booking@studio-fashion.com</p>
    </footer>

</body>
</html>
