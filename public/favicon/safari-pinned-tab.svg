<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg id="devevoke-svg" viewBox="0 0 1000 800" width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <!-- Ombre portée subtile entre les entrelacs -->
              <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
                <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#051329" flood-opacity="0.38"/>
              </filter>

              <filter id="innerShadowBevel" x="-5%" y="-5%" width="110%" height="110%">
                <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="#04192E" flood-opacity="0.45"/>
              </filter>

              <!-- Dégradé principal de l'arche 'D' (Turquoise lumineux en haut vers Bleu Océan en bas) -->
              <linearGradient id="dMainGrad" x1="25%" y1="12%" x2="65%" y2="90%">
                <stop offset="0%" stop-color="#38C6D9"/>
                <stop offset="28%" stop-color="#5FD9E6"/>
                <stop offset="62%" stop-color="#2294B8"/>
                <stop offset="100%" stop-color="#0E5A8A"/>
              </linearGradient>

              <!-- Dégradé du biseau supérieur/droit lumineux du 'D' -->
              <linearGradient id="dLightBevel" x1="20%" y1="10%" x2="80%" y2="85%">
                <stop offset="0%" stop-color="#8CF0F8"/>
                <stop offset="45%" stop-color="#A8F7FC"/>
                <stop offset="100%" stop-color="#2DA3C4"/>
              </linearGradient>

              <!-- Dégradé du biseau intérieur/sombre du 'D' -->
              <linearGradient id="dDarkBevel" x1="20%" y1="15%" x2="70%" y2="95%">
                <stop offset="0%" stop-color="#147491"/>
                <stop offset="50%" stop-color="#0E5E82"/>
                <stop offset="100%" stop-color="#083B66"/>
              </linearGradient>

              <!-- Dégradé de l'aile inférieure gauche du 'D' -->
              <linearGradient id="dBottomWingGrad" x1="75%" y1="10%" x2="15%" y2="95%">
                <stop offset="0%" stop-color="#64DCE8"/>
                <stop offset="45%" stop-color="#289BBF"/>
                <stop offset="100%" stop-color="#0F5F8C"/>
              </linearGradient>

              <!-- Dégradé de la branche supérieure du 'E' -->
              <linearGradient id="eTopGrad" x1="10%" y1="60%" x2="95%" y2="20%">
                <stop offset="0%" stop-color="#175A9E"/>
                <stop offset="50%" stop-color="#2D82C9"/>
                <stop offset="100%" stop-color="#48A4E8"/>
              </linearGradient>

              <!-- Biseau sombre branche supérieure du 'E' -->
              <linearGradient id="eTopBevelDark" x1="0%" y1="50%" x2="100%" y2="50%">
                <stop offset="0%" stop-color="#0B3569"/>
                <stop offset="100%" stop-color="#1B5D9E"/>
              </linearGradient>

              <!-- Dégradé de la colonne gauche entrelacée du 'E' -->
              <linearGradient id="eSpineGrad" x1="50%" y1="0%" x2="50%" y2="100%">
                <stop offset="0%" stop-color="#0D3C73"/>
                <stop offset="50%" stop-color="#1E62A8"/>
                <stop offset="100%" stop-color="#0B3162"/>
              </linearGradient>

              <!-- Dégradé de la barre centrale du 'E' (Cyan / Bleu vif) -->
              <linearGradient id="eMidGrad" x1="0%" y1="50%" x2="100%" y2="50%">
                <stop offset="0%" stop-color="#1877A8"/>
                <stop offset="35%" stop-color="#31A9CE"/>
                <stop offset="100%" stop-color="#48C4E2"/>
              </linearGradient>

              <!-- Dégradé de la branche inférieure du 'E' (Bleu Roi profond / Marine) -->
              <linearGradient id="eBotGrad" x1="10%" y1="20%" x2="95%" y2="80%">
                <stop offset="0%" stop-color="#0D3B75"/>
                <stop offset="55%" stop-color="#175299"/>
                <stop offset="100%" stop-color="#1D63AE"/>
              </linearGradient>

              <!-- Biseau contour sombre du 'E' inférieur -->
              <linearGradient id="eBotBevel" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#07234B"/>
                <stop offset="100%" stop-color="#0D3B73"/>
              </linearGradient>
            </defs>

            <!-- =============================================================== -->
            <!-- 1. ÉLÉMENTS DU 'E' SITUÉS EN ARRIÈRE-PLAN DU 'D'                -->
            <!-- =============================================================== -->

            <!-- Colonne verticale courbe du 'E' (entrelacée à l'intérieur de la boucle du D) -->
            <g id="E-left-spine">
              <!-- Base biseau sombre -->
              <path d="M 521 301&#10;                       C 491 360, 491 440, 522 503&#10;                       L 559 462&#10;                       C 547 422, 547 375, 558 340&#10;                       Z" fill="#092B5A"/>
              <!-- Corps bleu profond -->
              <path d="M 526 312&#10;                       C 502 365, 502 435, 527 491&#10;                       L 550 465&#10;                       C 538 424, 538 374, 549 338&#10;                       Z" fill="url(#eSpineGrad)"/>
              <!-- Reflet biseau interne droit de la colonne -->
              <path d="M 549 338 C 538 374, 538 424, 550 465 L 557 458 C 546 420, 546 376, 556 344 Z" fill="#3882C7" opacity="0.7"/>
            </g>

            <!-- Branche supérieure du 'E' -->
            <g id="E-top-arm">
              <!-- Socle biseau extérieur sombre -->
              <path d="M 559 243&#10;                       C 596 218, 642 207, 698 207&#10;                       L 789 207&#10;                       C 789 246, 767 273, 725 273&#10;                       L 668 273&#10;                       C 638 273, 616 280, 601 291&#10;                       Z" fill="url(#eTopBevelDark)"/>
              <!-- Biseau supérieur clair -->
              <path d="M 559 243&#10;                       C 596 218, 642 207, 698 207&#10;                       L 789 207&#10;                       L 777 219&#10;                       L 696 219&#10;                       C 644 219, 602 229, 571 251&#10;                       Z" fill="#67B8F0" opacity="0.85"/>
              <!-- Face principale intérieure de la branche supérieure du E -->
              <path d="M 571 251&#10;                       C 602 229, 644 219, 696 219&#10;                       L 776 219&#10;                       C 772 245, 754 260, 722 260&#10;                       L 666 260&#10;                       C 636 260, 611 267, 593 279&#10;                       Z" fill="url(#eTopGrad)"/>
            </g>

            <!-- Barre médiane horizontale du 'E' -->
            <g id="E-middle-bar">
              <!-- Socle biseauté -->
              <path d="M 618 363&#10;                       L 754 363&#10;                       C 754 404, 735 429, 696 429&#10;                       L 621 429&#10;                       Z" fill="#0E497A"/>
              <!-- Biseau supérieur lumineux -->
              <path d="M 618 363 L 754 363 L 742 375 L 620 375 Z" fill="#67CFF0" opacity="0.85"/>
              <!-- Corps turquoise/cyan de la barre médiane -->
              <path d="M 622 375&#10;                       L 741 375&#10;                       C 738 400, 723 416, 694 416&#10;                       L 623 416&#10;                       Z" fill="url(#eMidGrad)"/>
              <!-- Ombre portée gauche de l'arche D sur la barre médiane -->
              <path d="M 618 363 L 637 363 L 638 429 L 621 429 Z" fill="#07284F" opacity="0.45"/>
            </g>

            <!-- Branche inférieure du 'E' -->
            <g id="E-bottom-arm">
              <!-- Socle biseauté marine foncé -->
              <path d="M 609 502&#10;                       C 626 519, 650 528, 684 528&#10;                       L 732 528&#10;                       C 772 528, 795 554, 795 593&#10;                       L 696 593&#10;                       C 642 593, 599 580, 568 553&#10;                       Z" fill="url(#eBotBevel)"/>
              <!-- Face principale bleu profond -->
              <path d="M 602 513&#10;                       C 622 531, 648 540, 684 540&#10;                       L 730 540&#10;                       C 759 540, 776 557, 780 580&#10;                       L 696 580&#10;                       C 645 580, 606 568, 579 545&#10;                       Z" fill="url(#eBotGrad)"/>
              <!-- Reflet biseau supérieur de la branche inférieure -->
              <path d="M 609 502&#10;                       C 626 519, 650 528, 684 528&#10;                       L 732 528&#10;                       L 726 539&#10;                       L 682 539&#10;                       C 647 539, 621 529, 602 513&#10;                       Z" fill="#347BC4" opacity="0.7"/>
            </g>

            <!-- =============================================================== -->
            <!-- 2. LETTRE 'D' AU PREMIER PLAN (AVEC BISEAUX 3D HAUTE PRÉCISION) -->
            <!-- =============================================================== -->
            <g id="D-foreground" filter="url(#dropShadow)">
              
              <!-- Corps global extérieur du 'D' (Sert de base de biseau) -->
              <path d="M 308 207&#10;                       L 442 207&#10;                       C 554 207, 625 285, 625 400&#10;                       C 625 515, 554 593, 442 593&#10;                       L 310 593&#10;                       C 312 486, 375 402, 488 361&#10;                       L 486 427&#10;                       C 428 450, 395 485, 382 529&#10;                       L 440 529&#10;                       C 517 529, 560 476, 560 400&#10;                       C 560 324, 517 271, 440 271&#10;                       L 382 271&#10;                       C 396 308, 419 336, 455 354&#10;                       L 397 383&#10;                       C 339 346, 311 284, 308 207&#10;                       Z" fill="url(#dDarkBevel)"/>

              <!-- Biseau supérieur et extérieur droit très lumineux (effet 3D glacé) -->
              <path d="M 308 207&#10;                       L 442 207&#10;                       C 554 207, 625 285, 625 400&#10;                       C 625 468, 598 525, 550 559&#10;                       L 541 547&#10;                       C 586 515, 612 463, 612 400&#10;                       C 612 292, 545 220, 442 220&#10;                       L 321 220&#10;                       Z" fill="url(#dLightBevel)"/>

              <!-- Biseau lumineux sur l'arête supérieure de l'aile basse du 'D' -->
              <path d="M 310 593&#10;                       C 312 486, 375 402, 488 361&#10;                       L 486 427&#10;                       L 474 418&#10;                       L 475 379&#10;                       C 380 417, 326 492, 323 581&#10;                       Z" fill="url(#dLightBevel)"/>

              <!-- Face principale biseautée de l'arche du 'D' et de l'aile supérieure -->
              <path d="M 322 220&#10;                       L 442 220&#10;                       C 546 220, 612 292, 612 400&#10;                       C 612 508, 546 580, 442 580&#10;                       L 323 580&#10;                       C 326 492, 380 417, 475 379&#10;                       L 474 416&#10;                       C 414 442, 379 485, 366 542&#10;                       L 440 542&#10;                       C 526 542, 573 483, 573 400&#10;                       C 573 317, 526 258, 440 258&#10;                       L 365 258&#10;                       C 380 303, 405 335, 437 353&#10;                       L 398 370&#10;                       C 349 337, 325 284, 322 220&#10;                       Z" fill="url(#dMainGrad)"/>

              <!-- Nuance dédiée sur l'aile inférieure gauche pour reproduire le volume exact -->
              <path d="M 323 580&#10;                       C 326 492, 380 417, 475 379&#10;                       L 474 416&#10;                       C 414 442, 379 485, 366 542&#10;                       L 440 542&#10;                       L 440 580&#10;                       Z" fill="url(#dBottomWingGrad)" opacity="0.85"/>

              <!-- Filet lumineux de finition sur l'arête interne droite de la boucle du D -->
              <path d="M 440 542&#10;                       C 526 542, 573 483, 573 400&#10;                       C 573 317, 526 258, 440 258&#10;                       L 440 264&#10;                       C 521 264, 566 320, 566 400&#10;                       C 566 480, 521 536, 440 536&#10;                       Z" fill="#7CE8F5" opacity="0.55"/>
            </g>
          </svg>